[project]
name = "medresident-medical-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116,<0.117", "uvicorn[standard]>=0.35,<0.36"]

[project.optional-dependencies]
test = ["pytest>=8.4,<8.5", "httpx>=0.28,<0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medical_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

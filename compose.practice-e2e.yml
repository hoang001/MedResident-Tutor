# Disposable browser stack; never uses the development DB/volume/.env.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: medresident_test_browser
      POSTGRES_USER: e2e_user
      POSTGRES_PASSWORD: e2e_password_only
    tmpfs: [/var/lib/postgresql/data]
    ports: ["127.0.0.1:55439:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e_user -d medresident_test_browser"]
      interval: 2s
      retries: 30
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      APP_ENV: development
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://e2e_user:e2e_password_only@db:5432/medresident_test_browser
      JWT_SECRET_KEY: isolated-browser-tests-only-secret-at-least-32-characters
      FILE_STORAGE_PATH: /test-uploads
      PRACTICE_PROVIDER: mock
      PRACTICE_MOCK_SCENARIO: ${E2E_MOCK_SCENARIO:-success}
      CORS_ORIGINS: '["http://frontend:3000","http://localhost:3100"]'
    volumes:
      - ./data:/fixtures/data:ro
      - ./apps/backend/tests/e2e:/e2e:ro
      - uploads:/test-uploads
    ports: ["127.0.0.1:8100:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./apps/frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://backend:8000/api/v1
    ports: ["127.0.0.1:3100:3000"]
    depends_on: [backend]
  browser:
    image: mcr.microsoft.com/playwright:v1.56.1-noble
    working_dir: /tests
    volumes: ["./apps/frontend:/tests"]
    environment:
      E2E_BASE_URL: http://frontend:3000
      E2E_API_URL: http://backend:8000/api/v1
    ipc: host
    profiles: [test]
    command: ["npx", "playwright", "test"]
    depends_on: [frontend]
volumes:
  uploads:
